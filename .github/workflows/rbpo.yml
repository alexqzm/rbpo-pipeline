# Повторно используемый конвейер РБПО: технические артефакты ГОСТ Р 56939-2024 для каждого запуска.
#
# Подключение (в репозитории проекта):
#
#   jobs:
#     rbpo:
#       uses: alexqzm/rbpo-pipeline/.github/workflows/rbpo.yml@<коммит>
#       permissions: {contents: read, id-token: write, attestations: write}
#       with:
#         pipeline-spec: git+https://github.com/alexqzm/rbpo-pipeline@<тот же коммит>
#         install-command: pip install -e ".[test]"
#         test-command: pytest --junitxml="$RBPO_JUNIT"
#
# Задачи: analyze (код, секреты, SAST, SBOM и уязвимости, тесты, антивирус, среда) -> build и
# rebuild (две независимые сборки) -> verify (хранилище, повторяемость, аттестации) -> report
# (анализ неустранённых ошибок, манифест и отчёт rbpo-evidence, опись, решение по выпуску).
name: rbpo

on:
  workflow_call:
    inputs:
      working-directory:
        description: Каталог проекта внутри репозитория
        type: string
        default: "."
      python-version:
        description: Версия Python для сборки и тестов
        type: string
        default: "3.13"
      install-command:
        description: Установка проекта и зависимостей тестов (в каталоге проекта)
        type: string
        default: ""
      test-command:
        description: Запуск тестов; отчёт JUnit — в файл из переменной RBPO_JUNIT
        type: string
        default: ""
      build-command:
        description: Сборка; результаты — в каталог dist-dir
        type: string
        default: python -m pip install build==1.6.1 && python -m build --outdir dist .
      dist-dir:
        description: Каталог результатов сборки (относительно каталога проекта)
        type: string
        default: dist
      config:
        description: Настройки rbpo-pipeline (относительно каталога проекта)
        type: string
        default: rbpo.yaml
      semgrep-config:
        description: Набор правил Semgrep
        type: string
        default: p/default
      attest:
        description: Аттестации происхождения результатов сборки и комплекта свидетельств
        type: boolean
        default: true
      pipeline-repository:
        description: Репозиторий rbpo-pipeline (подписант аттестаций — его рабочий процесс)
        type: string
        default: alexqzm/rbpo-pipeline
      pipeline-spec:
        description: Требование pip для установки rbpo-pipeline; пусто — ветка main репозитория pipeline-repository
        type: string
        default: ""
    outputs:
      decision:
        description: "Решение по выпуску: pass или fail"
        value: ${{ jobs.report.outputs.decision }}
      overall:
        description: "Полнота свидетельств по rbpo-evidence: confirmed, missing или refuted"
        value: ${{ jobs.report.outputs.overall }}

permissions: {}

env:
  SYFT_CHECK_FOR_APP_UPDATE: "false"
  GRYPE_CHECK_FOR_APP_UPDATE: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  analyze:
    name: Код, зависимости, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      CONFIG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Установка rbpo-pipeline
        working-directory: ${{ github.workspace }}
        env:
          SPEC: ${{ inputs.pipeline-spec }}
          REPO: ${{ inputs.pipeline-repository }}
        run: |
          python -m venv "$RUNNER_TEMP/rbpo-venv"
          "$RUNNER_TEMP/rbpo-venv/bin/python" -m pip install --quiet "${SPEC:-git+https://github.com/$REPO@main}"
          mkdir -p "$RUNNER_TEMP/rbpo-bin"
          ln -s "$RUNNER_TEMP/rbpo-venv/bin/rbpo-pipeline" "$RUNNER_TEMP/rbpo-bin/rbpo-pipeline"
          echo "$RUNNER_TEMP/rbpo-bin" >> "$GITHUB_PATH"
          echo "RBPO_OUT=$RUNNER_TEMP/rbpo" >> "$GITHUB_ENV"

      - name: Изменения и целостность исходного кода (5.4.3.3, 5.14.3.3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: rbpo-pipeline source --out "$RBPO_OUT" --config "$CONFIG"

      - name: Инструменты анализа (версии и SHA-256 закреплены)
        run: |
          rbpo-pipeline install-tools --dest "$RUNNER_TEMP/rbpo-bin"
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --quiet semgrep==1.182.1

      - name: Поиск секретов во всей истории репозитория
        run: |
          mkdir -p "$RBPO_OUT/secrets"
          set +e
          gitleaks git --no-banner --redact --exit-code 3 --report-format json \
            --report-path "$RBPO_OUT/secrets/gitleaks.json" "$GITHUB_WORKSPACE"
          code=$?
          set -e
          rbpo-pipeline secrets --out "$RBPO_OUT" --config "$CONFIG" \
            --report "$RBPO_OUT/secrets/gitleaks.json" --exit-code "$code"

      - name: Статический анализ (5.10.3.2–5.10.3.4)
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          mkdir -p "$RBPO_OUT/sast"
          set +e
          PATH="$RUNNER_TEMP/semgrep-venv/bin:$PATH" semgrep scan --config "$SEMGREP_CONFIG" --metrics=off \
            --disable-version-check --quiet --sarif-output="$RBPO_OUT/sast/semgrep.sarif" \
            --json-output="$RBPO_OUT/sast/semgrep.json" .
          code=$?
          set -e
          rbpo-pipeline sast --out "$RBPO_OUT" --config "$CONFIG" --sarif "$RBPO_OUT/sast/semgrep.sarif" \
            --json "$RBPO_OUT/sast/semgrep.json" --config-name "$SEMGREP_CONFIG" --exit-code "$code"

      - name: Перечень зависимостей и известные уязвимости (5.16.3.2, 5.16.3.4)
        run: |
          mkdir -p "$RBPO_OUT/sca"
          set +e
          syft scan dir:. --quiet -o cyclonedx-json="$RBPO_OUT/sca/sbom.cdx.json"
          syft_code=$?
          grype_code=0
          if [ "$syft_code" -eq 0 ]; then
            grype "sbom:$RBPO_OUT/sca/sbom.cdx.json" --quiet -o json --file "$RBPO_OUT/sca/grype.json"
            grype_code=$?
          fi
          set -e
          rbpo-pipeline sca --out "$RBPO_OUT" --config "$CONFIG" --sbom "$RBPO_OUT/sca/sbom.cdx.json" \
            --grype "$RBPO_OUT/sca/grype.json" --sbom-exit-code "$syft_code" --grype-exit-code "$grype_code"

      - name: Организационные документы
        run: rbpo-pipeline org --out "$RBPO_OUT" --config "$CONFIG"

      - name: Установка проекта
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Функциональное тестирование (5.18.3.2, 5.18.3.3)
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          mkdir -p "$RBPO_OUT/tests"
          if [ -z "$TEST_COMMAND" ]; then
            rbpo-pipeline tests --out "$RBPO_OUT"
            exit 0
          fi
          set +e
          RBPO_JUNIT="$RBPO_OUT/tests/junit.xml" bash -c "$TEST_COMMAND" 2>&1 | tee "$RBPO_OUT/tests/test.log"
          code=${PIPESTATUS[0]}
          set -e
          rbpo-pipeline tests --out "$RBPO_OUT" --junit "$RBPO_OUT/tests/junit.xml" \
            --log "$RBPO_OUT/tests/test.log" --exit-code "$code"

      - name: Антивирусная проверка заимствованного кода (5.17.3.5)
        run: |
          mkdir -p "$RBPO_OUT/av"
          site="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          set +e
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD:/scan/project:ro" -v "$site:/scan/site-packages:ro" clamav/clamav:1.5.4 -c '
              freshclam --stdout --quiet || echo "freshclam: база не обновлена, используется база образа"
              clamscan --version
              clamscan -r -i --exclude-dir="^/scan/project/\.git$" /scan' > "$RBPO_OUT/av/clamscan.log" 2>&1
          code=$?
          set -e
          cat "$RBPO_OUT/av/clamscan.log"
          rbpo-pipeline av --out "$RBPO_OUT" --log "$RBPO_OUT/av/clamscan.log" --exit-code "$code" \
            --target "каталог проекта" --target "установленные пакеты Python ($site)"

      - name: Сведения о сборочной среде (5.12.3.2)
        if: always()
        run: PATH="$RUNNER_TEMP/semgrep-venv/bin:$PATH" rbpo-pipeline env --out "$RBPO_OUT"

      - name: Свидетельства задачи
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbpo-part-analyze
          path: ${{ runner.temp }}/rbpo
          if-no-files-found: error

  build:
    name: Сборка
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    outputs:
      artifact-id: ${{ steps.dist.outputs.artifact-id }}
      artifact-url: ${{ steps.dist.outputs.artifact-url }}
      artifact-digest: ${{ steps.dist.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Установка rbpo-pipeline
        working-directory: ${{ github.workspace }}
        env:
          SPEC: ${{ inputs.pipeline-spec }}
          REPO: ${{ inputs.pipeline-repository }}
        run: |
          python -m venv "$RUNNER_TEMP/rbpo-venv"
          "$RUNNER_TEMP/rbpo-venv/bin/python" -m pip install --quiet "${SPEC:-git+https://github.com/$REPO@main}"
          mkdir -p "$RUNNER_TEMP/rbpo-bin"
          ln -s "$RUNNER_TEMP/rbpo-venv/bin/rbpo-pipeline" "$RUNNER_TEMP/rbpo-bin/rbpo-pipeline"
          echo "$RUNNER_TEMP/rbpo-bin" >> "$GITHUB_PATH"
          echo "RBPO_OUT=$RUNNER_TEMP/rbpo" >> "$GITHUB_ENV"

      - name: Сборка с журналом (5.13.3.4)
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          DIST: ${{ inputs.dist-dir }}
        run: rbpo-pipeline build-run --out "$RBPO_OUT" --role build --command "$BUILD_COMMAND" --dist "$DIST" --clean

      - name: Результаты сборки в хранилище артефактов
        id: dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ inputs.working-directory }}/${{ inputs.dist-dir }}
          if-no-files-found: error

      - name: Аттестация происхождения результатов сборки
        if: inputs.attest && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.working-directory }}/${{ inputs.dist-dir }}/*

      - name: Свидетельства задачи
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbpo-part-build
          path: ${{ runner.temp }}/rbpo
          if-no-files-found: error

  rebuild:
    name: Повторная сборка
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Установка rbpo-pipeline
        working-directory: ${{ github.workspace }}
        env:
          SPEC: ${{ inputs.pipeline-spec }}
          REPO: ${{ inputs.pipeline-repository }}
        run: |
          python -m venv "$RUNNER_TEMP/rbpo-venv"
          "$RUNNER_TEMP/rbpo-venv/bin/python" -m pip install --quiet "${SPEC:-git+https://github.com/$REPO@main}"
          mkdir -p "$RUNNER_TEMP/rbpo-bin"
          ln -s "$RUNNER_TEMP/rbpo-venv/bin/rbpo-pipeline" "$RUNNER_TEMP/rbpo-bin/rbpo-pipeline"
          echo "$RUNNER_TEMP/rbpo-bin" >> "$GITHUB_PATH"
          echo "RBPO_OUT=$RUNNER_TEMP/rbpo" >> "$GITHUB_ENV"

      - name: Повторная сборка на отдельном исполнителе
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          DIST: ${{ inputs.dist-dir }}
        run: rbpo-pipeline build-run --out "$RBPO_OUT" --role rebuild --command "$BUILD_COMMAND" --dist "$DIST" --clean

      - name: Результаты повторной сборки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-rebuild
          path: ${{ inputs.working-directory }}/${{ inputs.dist-dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Свидетельства задачи
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbpo-part-rebuild
          path: ${{ runner.temp }}/rbpo
          if-no-files-found: error

  verify:
    name: Хранение, повторяемость, аттестации
    needs: [build, rebuild]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Установка rbpo-pipeline
        working-directory: ${{ github.workspace }}
        env:
          SPEC: ${{ inputs.pipeline-spec }}
          REPO: ${{ inputs.pipeline-repository }}
        run: |
          python -m venv "$RUNNER_TEMP/rbpo-venv"
          "$RUNNER_TEMP/rbpo-venv/bin/python" -m pip install --quiet "${SPEC:-git+https://github.com/$REPO@main}"
          mkdir -p "$RUNNER_TEMP/rbpo-bin"
          ln -s "$RUNNER_TEMP/rbpo-venv/bin/rbpo-pipeline" "$RUNNER_TEMP/rbpo-bin/rbpo-pipeline"
          echo "$RUNNER_TEMP/rbpo-bin" >> "$GITHUB_PATH"
          echo "RBPO_OUT=$RUNNER_TEMP/rbpo" >> "$GITHUB_ENV"

      - name: Результаты сборки из хранилища
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Свидетельства сборок
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rbpo-part-*build
          merge-multiple: true
          path: ${{ runner.temp }}/parts

      - name: Хранение (5.13.3.5), повторяемость (5.13.3.6), аттестации (5.20.3.4)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          SIGNER: ${{ inputs.pipeline-repository }}/.github/workflows/rbpo.yml
          ATTESTED: ${{ inputs.attest && github.event_name != 'pull_request' }}
        run: |
          rbpo-pipeline store-verify --out "$RBPO_OUT" --dist "$RUNNER_TEMP/dist" \
            --sums "$RUNNER_TEMP/parts/build/SHA256SUMS" --artifact-id "$ARTIFACT_ID" \
            --artifact-url "$ARTIFACT_URL" --artifact-digest "$ARTIFACT_DIGEST"
          rbpo-pipeline repro --out "$RBPO_OUT" --build "$RUNNER_TEMP/parts/build/SHA256SUMS" \
            --rebuild "$RUNNER_TEMP/parts/rebuild/SHA256SUMS"
          skip=""
          if [ "$ATTESTED" != "true" ]; then
            skip="аттестации для события $GITHUB_EVENT_NAME не создаются"
          fi
          rbpo-pipeline attest-verify --out "$RBPO_OUT" --dist "$RUNNER_TEMP/dist" \
            --signer-workflow "$SIGNER" --skip "$skip"

      - name: Свидетельства задачи
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbpo-part-verify
          path: ${{ runner.temp }}/rbpo
          if-no-files-found: error

  report:
    name: Комплект свидетельств и решение
    needs: [analyze, build, rebuild, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    outputs:
      decision: ${{ steps.assemble.outputs.decision }}
      overall: ${{ steps.assemble.outputs.overall }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Установка rbpo-pipeline
        working-directory: ${{ github.workspace }}
        env:
          SPEC: ${{ inputs.pipeline-spec }}
          REPO: ${{ inputs.pipeline-repository }}
        run: |
          python -m venv "$RUNNER_TEMP/rbpo-venv"
          "$RUNNER_TEMP/rbpo-venv/bin/python" -m pip install --quiet "${SPEC:-git+https://github.com/$REPO@main}"
          mkdir -p "$RUNNER_TEMP/rbpo-bin"
          ln -s "$RUNNER_TEMP/rbpo-venv/bin/rbpo-pipeline" "$RUNNER_TEMP/rbpo-bin/rbpo-pipeline"
          echo "$RUNNER_TEMP/rbpo-bin" >> "$GITHUB_PATH"
          echo "RBPO_OUT=$RUNNER_TEMP/rbpo" >> "$GITHUB_ENV"

      - name: Свидетельства всех задач
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rbpo-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/rbpo

      - name: Анализ неустранённых ошибок (5.20.3.2), манифест, отчёт, опись
        id: assemble
        env:
          NEEDS: ${{ toJSON(needs) }}
          CONFIG: ${{ inputs.config }}
        run: |
          rbpo-pipeline assemble --out "$RBPO_OUT" --config "$CONFIG" --needs-env NEEDS > "$RUNNER_TEMP/assemble.json"
          cat "$RBPO_OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          echo "decision=$(jq -r .decision.decision "$RUNNER_TEMP/assemble.json")" >> "$GITHUB_OUTPUT"
          echo "overall=$(jq -r .overall "$RUNNER_TEMP/assemble.json")" >> "$GITHUB_OUTPUT"

      - name: Архив комплекта
        run: |
          bundle="$RUNNER_TEMP/rbpo-evidence-${GITHUB_SHA::12}.tar.gz"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -C "$RBPO_OUT" -cf - . | gzip -n > "$bundle"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Аттестация комплекта свидетельств
        if: inputs.attest && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.BUNDLE }}

      - name: Комплект свидетельств
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rbpo-evidence
          path: |
            ${{ env.BUNDLE }}
            ${{ runner.temp }}/rbpo/report.md
            ${{ runner.temp }}/rbpo/SUMMARY.md
            ${{ runner.temp }}/rbpo/manifest.yaml
          if-no-files-found: error

      - name: Решение по выпуску
        run: rbpo-pipeline decision --out "$RBPO_OUT"

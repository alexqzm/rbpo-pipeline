# Настройки rbpo-pipeline для демонстрационного проекта.
project: "rbpo-demo-app — демонстрационный проект rbpo-pipeline"

policy:
  sast_fail_on: error          # срабатывания уровня error и выше требуют решения в файле разметки
  sca_fail_on: high            # уязвимости уровня high и critical требуют решения
  secrets: fail                # найденный секрет — выпуск не допускается
  commit_signatures: report    # подписи коммитов фиксируются, но не требуются
  reproducible: require        # различие двух сборок — выпуск не допускается

triage: .rbpo/triage.yaml

# Организационные артефакты: где в проекте лежит документ. Регламенты нескольких процессов
# собраны в одном руководстве, якорь указывает на раздел.
organizational:
  "5.4.3.1": docs/rbpo-guide.md#управление-конфигурацией
  "5.4.3.2": docs/rbpo-guide.md#элементы-конфигурации
  "5.10.3.1": docs/rbpo-guide.md#статический-анализ
  "5.12.3.1": docs/rbpo-guide.md#система-сборки
  "5.12.3.3": docs/rbpo-guide.md#рекомендации-по-инструментам-сборки
  "5.13.3.1": docs/rbpo-guide.md#безопасность-сборочной-среды
  "5.13.3.2": docs/rbpo-guide.md#сведения-о-безопасности-сборочной-среды
  "5.13.3.3": docs/rbpo-guide.md#схема-сборочной-среды
  "5.14.3.1": docs/rbpo-guide.md#доступ-к-исходному-коду-и-его-целостность
  "5.14.3.2": docs/rbpo-guide.md#модель-доступа-к-коду
  "5.16.3.1": docs/rbpo-guide.md#композиционный-анализ
  "5.18.3.1": docs/rbpo-guide.md#план-функционального-тестирования
  "5.18.3.4": docs/rbpo-guide.md#система-управления-ошибками
